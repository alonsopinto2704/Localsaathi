org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Both opt-outs below ship in Flutter 3.47.6's own app template and are
# temporary: AGP 10 removes them. Drop them when a fresh `flutter create` does.
# The Flutter Gradle plugin still reads the legacy android DSL types.
android.newDsl=false
# share_plus 11.x applies the Kotlin Gradle plugin itself, which AGP 9's
# built-in Kotlin rejects ("no longer required for Kotlin support").
android.builtInKotlin=false
