pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Same versions as the Flutter 3.47.6 app template (with the Gradle 9.3.1
    // wrapper). On a Flutter upgrade, `flutter create` a scratch app and copy
    // its versions. Kotlin is only put on the classpath here: the Flutter
    // plugin applies it to the app and plugins (see gradle.properties).
    id "com.android.application" version "9.1.0" apply false
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
}

include ":app"
